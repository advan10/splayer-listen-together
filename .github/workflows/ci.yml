name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时，掐掉还在跑的老任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # 服务端用 Node 原生类型剥离直接跑 .ts，需要 ≥ 22.18
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # 插件测试台不需要服务端；服务端演练会自己起一个
      - name: 插件测试台
        run: npm run test:plugin

      - name: 服务端演练
        run: npm run test:server
