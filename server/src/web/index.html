<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="robots" content="noindex" />
    <title>一起听</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' x='4' font-size='24'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 封面弥散出来的背景光晕 -->
    <div class="bg" id="bg" aria-hidden="true"></div>
    <div class="bg-veil" aria-hidden="true"></div>

    <!-- 服务端设了密钥时挡在门口的一层 -->
    <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
      <div class="card">
        <h3 id="gateTitle" data-i18n="gate.title">需要服务端密钥</h3>
        <p data-i18n="gate.desc">这台服务端开启了访问密钥，填对才能看房间。</p>
        <input
          id="gateInput"
          type="password"
          placeholder="服务端密钥"
          data-i18n-placeholder="gate.placeholder"
          autocomplete="current-password"
          aria-label="服务端密钥"
          data-i18n-aria="gate.placeholder"
        />
        <button id="gateButton" data-i18n="gate.enter">进入</button>
        <div class="error" id="gateError" role="alert"></div>
        <!-- 版本号也放一份在这儿：更新完服务端第一个看到的就是这一层 -->
        <div class="gate-version">一起听服务端 <span class="ver" data-server-version>—</span></div>
      </div>
    </div>

    <div class="wrap">
      <header class="topbar">
        <div class="topbar-left">
          <!-- 房间页才有：回房间列表 -->
          <a class="icon-btn back" id="backHome" href="/" title="返回房间列表" aria-label="返回房间列表" data-i18n-title="back.title" data-i18n-aria="back.title" hidden>←</a>
          <div class="brand">
            <span class="mark" aria-hidden="true">♪</span>
            <span class="label" data-i18n="brand.label">一起听</span>
            <span class="room" id="roomName">—</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="copyLink" title="复制房间链接" aria-label="复制房间链接" data-i18n-title="copyLink.title" data-i18n-aria="copyLink.title">⧉</button>
          <button class="icon-btn" id="langToggle" type="button" title="Switch to English"></button>
          <span class="status">
            <span class="dot" id="dot"></span>
            <span id="statusText" data-i18n="status.connecting">连接中…</span>
          </span>
        </div>
      </header>

      <section class="card now" id="now" aria-live="polite">
        <div class="empty">
          <div class="glyph" aria-hidden="true">♪</div>
          <div class="hint" data-i18n="now.empty">还没有人在播放</div>
        </div>
      </section>

      <section class="card" id="membersCard">
        <div class="section-head">
          <h2 data-i18n="section.members">房间成员</h2>
          <span class="count" id="memberCount"></span>
        </div>
        <ul class="members" id="members"></ul>
      </section>

      <!-- 房间详情：共享队列 -->
      <section class="card" id="queueCard">
        <div class="section-head">
          <h2 data-i18n="section.queue">房间队列</h2>
          <span class="count" id="queueCount"></span>
        </div>
        <ul class="queue" id="queue"></ul>
      </section>

      <!-- 根路径：列出这台服务端上现在有哪些房间 -->
      <section class="card" id="roomsCard" hidden>
        <div class="section-head">
          <h2 data-i18n="section.rooms">当前房间</h2>
          <span class="count" id="roomsCount"></span>
        </div>
        <ul class="rooms" id="rooms"></ul>
      </section>

      <footer>
        <div id="modeLine">—</div>
        <div data-i18n-html="footer.credit">一起听服务端 <span class="ver" data-server-version>—</span> · 由 <a href="https://github.com/SPlayer-Dev/SPlayer-Next" target="_blank" rel="noreferrer">SPlayer-Next</a> 控制插件上报 · <span id="serverTime">—</span></div>
      </footer>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="/app.js"></script>
  </body>
</html>
